name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Relay Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pytest

      - name: Run Test Verification Suite
        run: |
          python -m pytest

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Windows Installer & SHA-256 Checksums
        run: |
          python build_installer.py

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Relay-Setup-*.exe
            dist/SHA256SUMS.txt
          name: "Relay ${{ github.ref_name }} - Windows Desktop Installer"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
